<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlost Admin Shield</title>
    
    <!-- Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Link Unified External CSS via Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1 class="brand">🛡️ Admin Shield Dashboard</h1>
            <a href="/" class="btn-ghost">Back to Unlost User Panel &rarr;</a>
        </header>

        <section class="module-card">
            <h2>Device Token Management</h2>
            <table>
                <thead>
                    <tr>
                        <th>Device Fingerprint (SHA-256)</th>
                        <th>Used Tokens / Custom Limit</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr><td colspan="3">Fetching secure user registries...</td></tr>
                </tbody>
            </table>
        </section>

        <section class="module-card">
            <h2>Live Telemetry Stream</h2>
            <pre class="log-box" id="logView">Establishing telemetry uplink...</pre>
        </section>
    </div>

    <!-- Link External Admin JS via Flask -->
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
